name: Pages (static replay)

# Publishes the static, backend-free replay site (frontend/out-pages, built by
# `npm run build:pages`) to GitHub Pages. It plays the recorded runs committed under
# frontend/public/replay/; it needs no secrets, no API key and no FalkorDB.
#
# One-time setup by the repository owner: Settings → Pages → Source: "GitHub Actions".
# The site is served at https://<owner>.github.io/<repo>/, so the base path is the repo name.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel a deployment that is already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build static replay site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"   # next 16 requires >= 20.9
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      # build-pages.mjs fails the job if a replay bundle or required page is missing, if a page
      # loads assets outside the base path, or if any page references the live API.
      - name: Build static export (out-pages/)
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_FAULTLINE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/out-pages

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
