<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 358" width="820" height="358" role="img" aria-label="Same graph questions, same answers: FalkorDB and recursive SQL">
<title>Same graph questions, same answers: FalkorDB and recursive SQL</title>
<rect x="0.5" y="0.5" width="819" height="357" rx="12" fill="#fcfcfb" stroke="#e7e6e2"/>
<text x="24" y="34" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b0b0b">Same graph questions, same answers: FalkorDB and recursive SQL</text>
<text x="24" y="56" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e">1,000-service graph, p50 milliseconds, lower is better. FalkorDB includes the network round trip; DuckDB runs in-process.</text>
<line x1="290.0" y1="76" x2="290.0" y2="300" stroke="#e7e6e2"/>
<line x1="480.0" y1="76" x2="480.0" y2="300" stroke="#e7e6e2"/>
<line x1="670.0" y1="76" x2="670.0" y2="300" stroke="#e7e6e2"/>
<text x="276" y="98" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Shortest causal path: FalkorDB</text>
<g><title>FalkorDB round trip p50 ms</title><rect x="290" y="84" width="47.8" height="18" rx="4" fill="#2a78d6"/></g>
<text x="345.8" y="98" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">0.27 ms</text>
<text x="276" y="136" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e">Shortest causal path: DuckDB SQL</text>
<g><title>DuckDB recursive SQL p50 ms, in-process</title><rect x="290" y="122" width="219.5" height="18" rx="4" fill="#8c8a84"/></g>
<text x="517.5" y="136" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">1.22 ms</text>
<text x="276" y="174" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Blast radius (reach set): FalkorDB</text>
<g><title>FalkorDB round trip p50 ms</title><rect x="290" y="160" width="88.6" height="18" rx="4" fill="#2a78d6"/></g>
<text x="386.6" y="174" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">0.49 ms</text>
<text x="276" y="212" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e">Blast radius (reach set): DuckDB SQL</text>
<g><title>DuckDB recursive SQL p50 ms, in-process</title><rect x="290" y="198" width="322.8" height="18" rx="4" fill="#8c8a84"/></g>
<text x="620.8" y="212" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">1.79 ms</text>
<text x="276" y="250" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Hop distances: FalkorDB</text>
<g><title>FalkorDB round trip p50 ms</title><rect x="290" y="236" width="69.9" height="18" rx="4" fill="#2a78d6"/></g>
<text x="367.9" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">0.39 ms</text>
<text x="276" y="288" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e">Hop distances: DuckDB SQL</text>
<g><title>DuckDB recursive SQL p50 ms, in-process</title><rect x="290" y="274" width="380.0" height="18" rx="4" fill="#8c8a84"/></g>
<text x="678.0" y="288" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">2.10 ms</text>
<text x="24" y="340" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#77756f">Results were checked equal on every instance. Max flow has no SQL equivalent.</text>
</svg>
