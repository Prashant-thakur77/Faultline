<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faultline: proof charts</title>
<!-- Demo-video proof beat (frontend/scripts/record_demo_video.py): one chart at a time, full screen, chosen by the URL
     hash (#outcome, #false_blame, #ladder, #context_mrr, #vs_sql, #live). The SVGs under charts/ are byte-for-byte
     copies of docs/media/charts/ (drawn from evals/results/latest.json by scripts/gen_charts.py); docs/ is the
     source and the recorder refuses to run when a copy differs. Nothing here holds a number of its own. -->
<style>
  :root { --bg:#08090a; --muted:#8a8f98; }
  html, body { height:100%; margin:0; background:var(--bg); color:#fafafa; font:15px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px 0 96px; box-sizing:border-box; }
  figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:12px; }
  img { display:block; width:min(86vw, calc((100vh - 170px) * 2.05)); height:auto; max-height:calc(100vh - 170px); object-fit:contain;
        border-radius:14px; box-shadow:0 30px 80px -30px rgba(0,0,0,.8); }
  figcaption { font:500 12px/1.4 ui-monospace, "Geist Mono", monospace; letter-spacing:.06em; color:var(--muted); }
  .err { border:1px solid rgba(248,113,113,.6); background:rgba(239,68,68,.12); color:#fecaca; padding:12px 16px; border-radius:10px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <figure id="fig" hidden>
    <img id="chart" alt="">
    <figcaption>drawn from evals/results/latest.json by scripts/gen_charts.py · docs/PROOF.md</figcaption>
  </figure>
  <p id="err" class="err" role="alert" hidden></p>
<script>
  // Only the known chart names; anything else, or a chart that fails to load, is said plainly (never a blank frame).
  var CHARTS = {
    outcome: "Right outcome on the scenario suite",
    false_blame: "Confidently blaming the wrong change",
    ladder: "Take FalkorDB's algorithms away and the answers get worse",
    context_mrr: "Is the true cause near the top of the agent's context?",
    vs_sql: "Same graph questions, same answers: FalkorDB and recursive SQL",
    live: "The live deployment, measured over HTTPS"
  };
  var fig = document.getElementById("fig"), img = document.getElementById("chart"), err = document.getElementById("err");
  function fail(text) { fig.hidden = true; err.textContent = text; err.hidden = false; document.body.dataset.state = "error"; }
  function show() {
    var name = location.hash.slice(1);
    document.body.dataset.state = "loading";
    if (!Object.prototype.hasOwnProperty.call(CHARTS, name)) { fail("Unknown chart: “" + name + "”."); return; }
    img.onload = function () { err.hidden = true; fig.hidden = false; document.body.dataset.state = "ready"; document.body.dataset.chart = name; };
    img.onerror = function () { fail("Chart charts/" + name + ".svg could not be loaded."); };
    img.alt = CHARTS[name];
    img.src = "charts/" + name + ".svg";
  }
  window.addEventListener("hashchange", show);
  show();
</script>
</body>
</html>
