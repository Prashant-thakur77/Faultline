<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faultline: no path, no claim</title>
<!-- Demo-video end card (frontend/scripts/record_demo_video.py). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&display=block">
<style>
  :root { --bg:#08090a; --ink:#fafafa; --muted:#8a8f98; --ember:oklch(0.72 0.19 45); --iris:oklch(0.66 0.19 290); }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink); }
  body { display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:26px; padding:0 9vw 60px; box-sizing:border-box;
         font-family:"Mona Sans", Inter, ui-sans-serif, system-ui, sans-serif;
         background:
           radial-gradient(38% 42% at 22% 5%, color-mix(in oklch, var(--iris) 22%, transparent), transparent 78%),
           radial-gradient(34% 36% at 80% 8%, color-mix(in oklch, var(--ember) 16%, transparent), transparent 78%),
           var(--bg); }
  .mark { width:64px; height:64px; }
  h1 { margin:0; font-weight:800; font-stretch:112%; letter-spacing:-0.045em; line-height:.98; font-size:clamp(3.2rem, 9vw, 9rem);
       background:linear-gradient(100deg, var(--ink) 35%, oklch(0.86 0.06 290)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .repo { font:600 26px/1.3 ui-monospace, "Geist Mono", monospace; color:#e4e4e7; }
  .cmd { font:500 20px/1.3 ui-monospace, "Geist Mono", monospace; color:var(--muted); }
  .cmd code { color:var(--ink); padding:4px 10px; border:1px solid rgba(255,255,255,.12); border-radius:8px; background:rgba(255,255,255,.04); }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" fill="#f2f2f0">
    <path d="M10 4H18.1L11.1 28H10A6 6 0 0 1 4 22V10A6 6 0 0 1 10 4Z"/>
    <path d="M20.9 4H22A6 6 0 0 1 28 10V22A6 6 0 0 1 22 28H13.9Z" transform="translate(1 1.4)"/>
    <path d="M19.5 4L12.5 28" transform="translate(0.5 0.7)" stroke="oklch(0.72 0.19 45)" stroke-width="1.3" stroke-linecap="round"/>
  </svg>
  <h1>No path,<br>no claim.</h1>
  <p class="repo">github.com/Prashant-thakur77/Faultline</p>
  <p class="cmd">Verify it yourself, no API key: <code>make judge-check</code></p>
</body>
</html>
