  - {client: mobile-bff, server: push-service, rps: 10, cap: 0.0, why: "push registration is queued"}
  - {client: partner-api, server: catalog-service, rps: 30, cap: 1.0}
  - {client: partner-api, server: order-api, rps: 10, cap: 1.0}
  - {client: profile-service, server: address-book, rps: 40, cap: 1.0}
  - {client: profile-service, server: preferences-api, rps: 30, cap: 0.02, why: "preferences default when unavailable"}
  - {client: profile-service, server: loyalty-service, rps: 30, cap: 0.02, why: "loyalty balance is optional on the profile"}
  - {client: loyalty-service, server: ledger-service, rps: 10, cap: 1.0}
  - {client: order-api, server: order-orchestrator, rps: 70, cap: 1.0}
  - {client: order-api, server: address-book, rps: 70, cap: 1.0}
  - {client: order-orchestrator, server: basket-service, rps: 70, cap: 1.0}
  - {client: order-orchestrator, server: pricing, rps: 70, cap: 1.0}
  - {client: order-orchestrator, server: reservation-service, rps: 70, cap: 1.0}
  - {client: order-orchestrator, server: card-gateway, rps: 70, cap: 1.0}
