endpoints:
  - {id: "edge-gateway:/v1", service: edge-gateway, route: /v1/*, protocol: http}
  - {id: "order-api:PlaceOrder", service: order-api, route: /globex.orders.OrderApi/PlaceOrder, protocol: grpc}
  - {id: "order-orchestrator:Checkout", service: order-orchestrator, route: /globex.orders.Saga/Checkout, protocol: grpc}
  - {id: "card-gateway:Authorize", service: card-gateway, route: /globex.billing.CardGateway/Authorize, protocol: grpc}
  - {id: "pricing:Quote", service: pricing, route: /v2/prices/quote, protocol: http}
  - {id: "search-api:/search", service: search-api, route: /search, protocol: http}
  - {id: "storefront-bff:/pdp", service: storefront-bff, route: "/pdp/{sku}", protocol: http}
  - {id: "session-service:Resume", service: session-service, route: /globex.identity.Sessions/Resume, protocol: grpc}
  - {id: "stock-api:Level", service: stock-api, route: "/v1/stock/{sku}", protocol: http}

# Obligations (M12 obligation clock), same model as acme (data/topology/otel-demo.yaml). SYNTHETIC: names, MRR and
# budgets are invented. One error-rate SLO per tier-1 and tier-2 Service (generated services included); the
# objectives match acme for the same reason (healthy simulated error rate 0.2-0.8%).
slo_policy:
  metric: error_rate
  window_days: 30
  objective_by_tier: {1: 0.99, 2: 0.98}
  spent_prior: [0.2, 0.6]
customers:
  - {id: gx-cust-halcyon-retail, name: "Halcyon Retail Group (synthetic)", tier: 1, mrr: 15000,
     consumes: [{node: storefront-bff, via: white-label storefront}, {node: order-api, via: "orders API (PlaceOrder)"}]}
  - {id: gx-cust-meridian-mobile, name: "Meridian Mobile (synthetic)", tier: 1, mrr: 11000,
     consumes: [{node: mobile-bff, via: mobile app SDK}]}
  - {id: gx-cust-tessellate, name: "Tessellate Marketplace (synthetic)", tier: 2, mrr: 6000,
     consumes: [{node: partner-api, via: partner marketplace API}, {node: search-api, via: search API}]}
  - {id: gx-cust-quillon-books, name: "Quillon Books (synthetic)", tier: 2, mrr: 3500,
     consumes: [{node: storefront-bff, via: white-label storefront}]}
  - {id: gx-cust-northgate-logistics, name: "Northgate Logistics (synthetic)", tier: 2, mrr: 4200,
     consumes: [{node: tracking-api, via: parcel tracking API}]}
  - {id: gx-cust-saffron-foods, name: "Saffron Foods (synthetic)", tier: 3, mrr: 900,
     consumes: [{node: edge-gateway, via: public API}]}
  - {id: gx-cust-brightwell-pay, name: "Brightwell Payments (synthetic)", tier: 1, mrr: 8000,
     consumes: [{node: pricing, via: "pricing API (Quote)"}]}

# Feature flags. `cuts: [src, dst]` = the failure-flow edge the flag removes when switched (a containment lever).
flags:
  - {id: recommenderRail, gates: "storefront-bff:/pdp", state: "on", cuts: [recommender, storefront-bff], note: "containment lever: when off, product pages hide the recommendation rail"}
  - {id: recommenderCacheWarmup, gates: recommender, state: "on", note: "pre-warms the recommender cache on deploy"}
  - {id: deferredCapture, gates: "order-orchestrator:Checkout", state: "on", cuts: [card-gateway, order-orchestrator], note: "containment lever: when off, checkout accepts the order and captures the card later"}
  - {id: legacyCacheBypass, gates: session-service, state: "on", cuts: [legacy-cache, session-service], note: "containment lever: when off, sessions resume from session-store only"}
  - {id: fxStaticRates, gates: fx-converter, state: "on", cuts: [ext-fx-rates, fx-converter], note: "containment lever: when off, fx-converter serves the last published daily rates"}
  - {id: promoEngineEnabled, gates: pricing, state: "on", cuts: [promo-engine, pricing], note: "containment lever: when off, prices are served without promotions"}
  - {id: pricingRulesV2, gates: pricing, state: "on", note: "new pricing rules; off reverts to v1 rules"}
  - {id: authTokenRotation, gates: auth-service, state: "off", note: "experimental token rotation"}
  - {id: stockReadReplica, gates: "stock-api:Level", state: "off", note: "serve stock levels from the read replica"}

# Ownership history: (component, previous team, current team, days before ANCHOR the move happened).
ownership_changes:
  - {component: experiment-service, from: discovery, to: insights, days: 60}
  - {component: address-book, from: orders, to: accounts, days: 85}
# Orphans: the owning team gave the component up and nobody picked it up (Q-GAP-1 no_owner rows).
orphans:
  - {component: gift-card-service, from: pricing, days: 34}
  - {component: partner-api, from: edge, days: 52}

org:
  people: 180
  directors: [[edge, accounts, orders, discovery], [logistics, messaging, pricing, billing], [inventory, identity, insights, infra]]
  inactive: 18
  # The sole expert of `component` left `days` ago (bus factor: their commits dominate, they are inactive).
  departed_expert: {team: pricing, component: pricing, days: 9}
  # Components whose top author is an active single point of knowledge (bus factor 1).
  dominant_active: [ledger-service, tax-calculator]

history:
  deploys_per_day: [6, 8, 9, 10, 12]
  deploy_weight: {recommender: 9, card-gateway: 9, pricing: 9, order-orchestrator: 8, storefront-bff: 8, search-api: 7, auth-service: 7, fx-converter: 6, ledger-service: 6, session-service: 6}
  default_weight: 2
  max_incidents_per_day: 2

# Eight incident families (150 incidents). The same Symptom node per family; causes change the same component.
archetypes:
  - name: recs_stampede
    count: 22
    causes: [recommender]
    kind: deploy
    symptom: {kind: latency, target: recommender}
    impacted: [catalog-service, storefront-bff]
    fixes: [flip_flag, flip_flag, rollback_deploy]
    flag: recommenderRail
    titles: ["Recommender cache stampede after deploy", "Recommender latency spike after cache key change", "Cold recommender cache overloads the catalogue"]
    openings:
      - "Deploy {deploy} changed cache keys in {cause}; the cache emptied at once and every request recomputed (a stampede)."
      - "After {deploy}, {cause} started cold and its latency climbed as all requests missed the cache together."
      - "A {cause} release ({deploy}) invalidated its cache in one go and the stampede slowed {symptom}."
    impacts: ["The recompute load spilled onto {impacted}.", "Both {impacted} saw extra load from the misses.", ""]
  - name: card_gateway
    count: 20
    causes: [card-gateway]
    kind: deploy
    symptom: {kind: error_rate, target: order-orchestrator}
    impacted: [order-api, storefront-bff]
    fixes: [rollback_deploy, rollback_deploy, flip_flag]
    flag: deferredCapture
    not_applied_ordinal: 2
    titles: ["Checkout failures after card gateway deploy", "Card authorisations failing at checkout", "Order saga errors from card gateway"]
    openings:
      - "Deploy {deploy} shipped a new {cause} build and card authorisations began failing, which surfaced as {symptom} errors."
      - "Shortly after {deploy} rolled out to {cause}, {symptom} started failing orders at the payment step."
      - "A {cause} release ({deploy}) broke authorisation retries and the {symptom} error rate jumped within minutes."
    impacts: ["Orders placed through {impacted} were rejected until mitigation.", "Shoppers on {impacted} saw failed checkouts.", ""]
  - name: legacy_cache
    count: 18
    causes: [legacy-cache]
    kind: config
    symptom: {kind: error_rate, target: session-service}
    impacted: [auth-service, storefront-bff]
    fixes: [flip_flag, rollback_deploy]
    flag: legacyCacheBypass
    titles: ["Session resume errors from legacy cache", "Legacy cache evictions log users out", "Login sessions failing after cache config change"]
    openings:
      - "A config change to {cause} ({deploy}) shrank its memory and {symptom} failed to resume sessions."
      - "After {deploy}, {cause} evicted hot keys and {symptom} returned errors for returning users."
      - "Deploy {deploy} altered {cause} settings; connection churn pushed the {symptom} error rate up."
    impacts: ["Users of {impacted} were logged out.", "Requests through {impacted} failed authentication for a while.", ""]
  - name: ledger_lock
    count: 18
    causes: [ledger-db]
    kind: config
    symptom: {kind: latency, target: ledger-service}
    impacted: [card-gateway, invoice-service]
    fixes: [rollback_deploy, open_issue]
    flag: null
    titles: ["Ledger latency from database lock contention", "Ledger writes slow after database config change", "Lock waits on ledger-db slow down postings"]
    openings:
      - "A config change to {cause} ({deploy}) held long locks and {symptom} postings queued behind them."
      - "Deploy {deploy} altered {cause} settings; lock contention pushed {symptom} latency far above its band."
      - "Lock waits on {cause} after {deploy} made {symptom} slow to record postings."
    impacts: ["Callers such as {impacted} inherited the slowdown.", "Both {impacted} timed out on ledger writes.", ""]
  - name: pricing_rules
    count: 18
    causes: [pricing]
    kind: deploy
