# globex: the SCALE tenant (M8). Synthetic, fictional company; every name here is ours.
# backend/faultline/ingest/globex/ expands this spec deterministically (seed 42) into ~200 services in 12 domains
# with a preferential-attachment call graph, 6 datastores, 3 external dependencies, 180 people and 150 past
# incidents. Same schema and property conventions as acme, so every template runs unchanged.
#
# cap = criticality of a call for failure propagation (1.0 synchronous; 0.02 best-effort; 0.0 async, no
# failure-flow edge); rps = fixed traffic matrix (entry edge-gateway = entry_rps). Every best-effort/async cap
# carries a one-line reason. Calls go from a domain listed earlier to one listed later (a DAG), except the
# event-bus deliveries listed under `calls`; every consumer sits after every publisher, so no cycle can form.
tenant: globex
entry: edge-gateway
entry_rps: 1000
services_total: 200
host: git.globex.example

# Generic service roles; each domain is filled up to its quota with `<prefix>-<stem>`.
stems: [api, worker, scheduler, reconciler, indexer, validator, events, exporter, adapter, sync, admin, reports,
        archiver, notifier, auditor, router, backfill, webhooks, cache-warmer, importer, rules, quota]
# Roles that run on a timer (no inbound callers): sources of their own traffic.
batch_stems: [scheduler, backfill, archiver, importer]

# Domains = teams, in call order (a domain may call domains listed after it). `platform: true` domains are the
# shared services everyone may depend on (preferential attachment makes hubs out of them).
domains:
  - key: edge
    name: Edge
    prefix: edge
    langs: [go, typescript]
    revenue: true
    anchors:
      - {id: edge-gateway, name: edge api gateway, tier: 1, revenue_path: true}
      - {id: storefront-bff, name: storefront backend for frontend, tier: 1, revenue_path: true}
      - {id: mobile-bff, name: mobile app backend for frontend, tier: 1, revenue_path: true}
      - {id: partner-api, name: partner marketplace api, tier: 2, revenue_path: true}
  - key: orders
    name: Orders
    prefix: orders
    langs: [go, java]
    revenue: true
    anchors:
      - {id: order-api, name: order placement api, tier: 1, revenue_path: true}
      - {id: order-orchestrator, name: order orchestration saga, tier: 1, revenue_path: true}
      - {id: basket-service, name: shopping basket service, tier: 1, revenue_path: true}
      - {id: order-history, name: order history service, tier: 2, revenue_path: false}
  - key: discovery
    name: Discovery
    prefix: discovery
    langs: [python, java]
    revenue: false
    anchors:
      - {id: search-api, name: product search api, tier: 1, revenue_path: true}
      - {id: recommender, name: product recommender, tier: 2, revenue_path: false}
      - {id: catalog-service, name: product catalogue service, tier: 1, revenue_path: true}
      - {id: ranking-service, name: search ranking service, tier: 2, revenue_path: false}
  - key: accounts
    name: Accounts
    prefix: accounts
    langs: [java, kotlin]
    revenue: false
    anchors:
      - {id: profile-service, name: customer profile service, tier: 2, revenue_path: false}
      - {id: loyalty-service, name: loyalty points service, tier: 2, revenue_path: false}
      - {id: address-book, name: customer address book, tier: 2, revenue_path: true}
      - {id: preferences-api, name: customer preferences api, tier: 3, revenue_path: false}
  - key: logistics
    name: Logistics
    prefix: logistics
    langs: [rust, go]
    revenue: true
    anchors:
      - {id: dispatch-service, name: parcel dispatch service, tier: 1, revenue_path: true}
      - {id: tracking-api, name: parcel tracking api, tier: 2, revenue_path: false}
      - {id: route-planner, name: delivery route planner, tier: 2, revenue_path: false}
      - {id: carrier-adapter, name: courier carrier adapter, tier: 1, revenue_path: true}
  - key: messaging
    name: Messaging
    prefix: messaging
    langs: [elixir, ruby]
    revenue: false
    anchors:
      - {id: notify-dispatcher, name: notification dispatcher, tier: 2, revenue_path: false}
      - {id: sms-sender, name: sms sender, tier: 3, revenue_path: false}
      - {id: mail-relay, name: transactional mail relay, tier: 3, revenue_path: false}
      - {id: push-service, name: mobile push notifications, tier: 3, revenue_path: false}
  - key: pricing
    name: Pricing
    prefix: pricing
    langs: [kotlin, python]
    revenue: true
    anchors:
      - {id: pricing, name: price calculation service, tier: 1, revenue_path: true}
      - {id: promo-engine, name: promotions and coupon engine, tier: 2, revenue_path: true}
      - {id: tax-calculator, name: sales tax calculator, tier: 1, revenue_path: true}
      - {id: fx-converter, name: foreign exchange converter, tier: 1, revenue_path: true}
      - {id: gift-card-service, name: gift card balance service, tier: 2, revenue_path: true}
  - key: billing
    name: Billing
    prefix: billing
    langs: [java, go]
    revenue: true
    anchors:
      - {id: refund-service, name: refund processing service, tier: 2, revenue_path: true}
      - {id: card-gateway, name: card payments gateway, tier: 1, revenue_path: true}
      - {id: invoice-service, name: invoice generation service, tier: 2, revenue_path: true}
      - {id: ledger-service, name: double entry ledger service, tier: 1, revenue_path: true}
  - key: inventory
    name: Inventory
    prefix: inventory
    langs: [go, dotnet]
    revenue: true
    anchors:
      - {id: reservation-service, name: stock reservation service, tier: 1, revenue_path: true}
      - {id: stock-api, name: stock level api, tier: 1, revenue_path: true}
      - {id: inventory-sync, name: inventory sync consumer, tier: 2, revenue_path: false}
      - {id: warehouse-locator, name: warehouse locator, tier: 2, revenue_path: false}
  - key: identity
    name: Identity
    prefix: identity
    langs: [go, rust]
    revenue: true
    platform: true
    anchors:
      - {id: auth-service, name: authentication service, tier: 1, revenue_path: true}
      - {id: session-service, name: login session service, tier: 1, revenue_path: true}
      - {id: token-issuer, name: access token issuer, tier: 1, revenue_path: false}
      - {id: user-directory, name: user directory, tier: 2, revenue_path: false}
  - key: insights
    name: Insights
    prefix: insights
    langs: [python, typescript]
    revenue: false
    platform: true
    anchors:
      - {id: event-collector, name: clickstream event collector, tier: 3, revenue_path: false}
      - {id: experiment-service, name: experiment assignment service, tier: 2, revenue_path: false}
      - {id: report-builder, name: finance report builder, tier: 3, revenue_path: false}
      - {id: metrics-api, name: business metrics api, tier: 3, revenue_path: false}
  - key: infra
    name: Infrastructure
    prefix: infra
    langs: [go, rust]
    revenue: false
    platform: true
    anchors:
      - {id: config-service, name: runtime configuration service, tier: 2, revenue_path: false}
      - {id: flag-service, name: feature flag service, tier: 2, revenue_path: false}
      - {id: service-registry, name: service registry, tier: 2, revenue_path: false}
      - {id: secrets-broker, name: secrets broker, tier: 2, revenue_path: false}
      - {id: audit-log, name: audit log sink, tier: 3, revenue_path: false}

# Preferential-attachment caps by callee (anything not listed: same-domain mix below).
callee_caps:
  audit-log: {cap: 0.0, why: "audit events are fire-and-forget"}
  event-collector: {cap: 0.0, why: "clickstream events are fire-and-forget"}
  metrics-api: {cap: 0.0, why: "metrics are pushed asynchronously"}
  config-service: {cap: 0.0, why: "config is cached locally; a failure serves the last known value"}
  flag-service: {cap: 0.0, why: "flags are cached locally; a failure serves the last known value"}
  service-registry: {cap: 0.0, why: "endpoints are cached; a failure keeps the last resolution"}
  secrets-broker: {cap: 0.0, why: "secrets are fetched at start-up and cached"}
  token-issuer: {cap: 0.02, why: "signing keys are cached; tokens are validated locally"}
  user-directory: {cap: 0.02, why: "directory lookups are cached and optional"}
# Datastores only the backbone may call (the bus would form cycles; legacy-cache is being retired).
backbone_only: [event-bus, legacy-cache]
# Who calls a non-batch service that preferential attachment left without a caller and that has no earlier
# anchor in its own domain.
fallback_caller: storefront-bff
same_domain_mix: {sync: 0.65, best_effort: 0.2, async: 0.15}
best_effort_why: "optional enrichment; the caller degrades gracefully"
async_why: "work is handed off asynchronously; failures are retried later"

datastores:
  - {id: ledger-db, name: ledger postgres database, kind: postgres, owner: billing}
  - {id: stock-db, name: stock postgres database, kind: postgres, owner: inventory}
  - {id: session-store, name: session redis store, kind: redis, owner: identity}
  - {id: legacy-cache, name: legacy memcached session cache, kind: memcached, owner: identity}
  - {id: event-bus, name: kafka event bus, kind: kafka, owner: infra}
  - {id: search-index, name: opensearch product index, kind: opensearch, owner: discovery}

externals:
  - {id: ext-card-network, name: card network acquirer, kind: payments}
  - {id: ext-fx-rates, name: fx rates provider, kind: market-data}
  - {id: ext-sms-carrier, name: sms carrier gateway, kind: telecom}

# The hand-designed backbone (client -> server). Preferential attachment adds the rest.
calls:
