<text x="24" y="378" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#77756f">Pre-registered, one laptop, five faults. Recency looks strong on faults only because the flag flip lands just before the page; it blames a change in every control.</text>
