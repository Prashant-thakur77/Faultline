<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" width="760" height="358" role="img" aria-label="Right outcome on the scenario suite">
<title>Right outcome on the scenario suite</title>
<rect x="0.5" y="0.5" width="759" height="357" rx="12" fill="#fcfcfb" stroke="#e7e6e2"/>
<text x="24" y="34" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b0b0b">Right outcome on the scenario suite</text>
<text x="24" y="56" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e">Share of trials with the correct verdict (confirm the true cause, or abstain when there is none). Higher is better. Eval run_0033.</text>
<line x1="250.0" y1="76" x2="250.0" y2="300" stroke="#e7e6e2"/>
<line x1="470.0" y1="76" x2="470.0" y2="300" stroke="#e7e6e2"/>
<line x1="690.0" y1="76" x2="690.0" y2="300" stroke="#e7e6e2"/>
<text x="236" y="98" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Faultline (graph + evidence gate)</text>
<g><title>Faultline (graph + evidence gate): outcome_correct_rate = 1.0 over 24 trials</title><rect x="250" y="84" width="440.0" height="18" rx="4" fill="#2a78d6"/></g>
<text x="698.0" y="98" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">100%</text>
<text x="236" y="136" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e">Same, max-flow check G5 off</text>
<g><title>Same, max-flow check G5 off: outcome_correct_rate = 0.875 over 24 trials</title><rect x="250" y="122" width="385.0" height="18" rx="4" fill="#8c8a84"/></g>
<text x="643.0" y="136" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">87.5%</text>
<text x="236" y="174" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e">Telemetry only</text>
<g><title>Telemetry only: outcome_correct_rate = 0.625 over 8 trials</title><rect x="250" y="160" width="275.0" height="18" rx="4" fill="#8c8a84"/></g>
<text x="533.0" y="174" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">62.5%</text>
<text x="236" y="212" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e">Vector similarity only</text>
<g><title>Vector similarity only: outcome_correct_rate = 0.25 over 24 trials</title><rect x="250" y="198" width="110.0" height="18" rx="4" fill="#8c8a84"/></g>
<text x="368.0" y="212" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">25%</text>
<text x="236" y="250" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e">Naive recency</text>
<text x="258.0" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">0%</text>
<text x="236" y="288" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e">FalkorDB switched off</text>
<text x="258.0" y="288" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">0%</text>
<text x="24" y="340" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#77756f">FalkorDB switched off fails closed: it confirms nothing rather than guessing.</text>
</svg>
