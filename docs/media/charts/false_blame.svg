<text x="258.0" y="98" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">0%</text>
<text x="236" y="136" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e">Telemetry only</text>
<g><title>Telemetry only: false_blame_rate = 0.2 over 8 trials</title><rect x="250" y="122" width="88.0" height="18" rx="4" fill="#8c8a84"/></g>
<text x="346.0" y="136" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">20%</text>
<text x="236" y="174" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e">Vector similarity only</text>
<g><title>Vector similarity only: false_blame_rate = 0.6 over 24 trials</title><rect x="250" y="160" width="264.0" height="18" rx="4" fill="#8c8a84"/></g>
<text x="522.0" y="174" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0b0b0b">60%</text>
<text x="236" y="212" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52514e">Naive recency</text>
