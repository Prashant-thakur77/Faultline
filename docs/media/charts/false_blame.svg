<text x="24" y="34" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0b0b0b">Confidently blaming the wrong change</text>
<text x="24" y="56" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e">Share of scenarios with a true cause where the approach blamed a different change. Lower is better. Eval run_0032.</text>
<line x1="250.0" y1="76" x2="250.0" y2="224" stroke="#e7e6e2"/>
